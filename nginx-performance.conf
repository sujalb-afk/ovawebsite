# OVA production performance config (drop into your server block).
# This covers gzip/brotli and long-term caching for hashed static files.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml image/webp;
gzip_comp_level 6;

brotli on;
brotli_comp_level 6;
brotli_types text/plain text/css application/javascript application/json image/svg+xml;

# Cache immutable static assets aggressively
location ~* \.(js|css|png|webp|woff2)$ {
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# Do not cache HTML documents
location ~* \.html$ {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
}
